<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>s2akit</title>
    <style>
      /* 内联启动样式：Vuetify CSS 加载前先渲染占位，底色与 apple.css 画布一致避免闪白 */
      html,
      body {
        margin: 0;
        background: #f2f3f5;
      }
      #app.boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        color: #6e6e73;
        font-size: 13px;
        letter-spacing: -0.01em;
        gap: 8px;
      }
      #app.boot .ring {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(0, 0, 0, 0.08);
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app" class="boot"><div class="ring"></div>正在启动 s2akit…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
