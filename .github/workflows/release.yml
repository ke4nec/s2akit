# 发布流水线：推送 v* 标签触发，构建 Windows/macOS/Linux 安装包并发布 GitHub Release。
# tauri-action 检测到 updater 配置后会自动生成 latest.json（含各产物 minisign 签名），
# 客户端即通过 releases/latest/download/latest.json 检查与校验更新。
# 发版前需同步升三处版本号：package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json
# 存储说明：本流水线不产生 Actions Artifacts（产物由 tauri-action 直传 Release），无中间存储可清理。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      # Linux 打包依赖：webkit/appindicator 等系统库 Runner 镜像默认不带
      - name: Install Linux dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf

      # tag 与 tauri.conf.json 版本不一致时直接失败：
      # updater 只认 latest.json 里的 version（来自 conf），忘升版本号会导致更新提示静默失效
      - name: Verify tag matches tauri.conf.json version
        shell: bash
        run: |
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VER" != "$TAG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 tauri.conf.json version $CONF_VER 不一致"
            exit 1
          fi

      # npm / Cargo 双缓存：三平台矩阵各自命中依赖缓存，避免每次发版全量编译
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # 发版上传 Release 资产必需（顶层 permissions 已给 contents:write）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "s2akit ${{ github.ref_name }}"
          releaseBody: "见附件资产下载安装；已安装用户可由应用内自动更新升级。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # portable 版只发 Windows：exe 与安装包同名打 zip，解压即用（与 ci 滚动预发布同名规则）
      - name: Upload portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "src-tauri/target/${{ matrix.target }}/release/s2akit.exe"
          $portableName = "s2akit_${version}_windows-x64_portable.exe"
          $portableZip = "s2akit_${version}_windows-x64_portable.zip"
          $stage = Join-Path ([System.IO.Path]::GetTempPath()) ("s2akit-portable-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          try {
            Copy-Item $exe.FullName (Join-Path $stage $portableName) -Force
            if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
            Compress-Archive -Path (Join-Path $stage $portableName) -DestinationPath $portableZip -CompressionLevel Optimal -Force
          } finally {
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
          gh release upload ${{ github.ref_name }} $portableZip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
