name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  # 删除中转 Artifacts 需要 actions: write，发布成功后立即释放 Actions 存储
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-aarch64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # act 本地模拟时 GITHUB_TOKEN 是假的，跳过缓存服务，只装 Node
      - name: Setup Node (act)
        if: ${{ env.ACT }}
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        if: ${{ !env.ACT }}
        uses: dtolnay/rust-toolchain@stable

      # npm / Cargo 双缓存：三平台最耗时的是依赖编译，命中后增量构建只需几分钟
      - name: Rust cache
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 构建失败也保存已编译的依赖，重试时无需从头编译
          cache-on-failure: true

      # Linux 打包依赖：webkit/appindicator 等系统库 Runner 镜像默认不带
      - name: Install Linux dependencies
        if: ${{ !env.ACT && matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        if: ${{ !env.ACT }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build (tauri)
        if: ${{ !env.ACT }}
        env:
          # 更新器签名私钥（仓库 Secrets，需与 tauri.conf.json 里 updater.pubkey 配对）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      # act 容器里没有 Rust/系统工具链，无法真实编译，用假产物走通后续流程
      - name: Simulate bundle artifacts (act)
        if: ${{ env.ACT }}
        shell: bash
        run: |
          mkdir -p dist src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi src-tauri/target/release/bundle/dmg src-tauri/target/release/bundle/macos src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage src-tauri/target/release
          printf 'dummy exe' > 'src-tauri/target/release/s2akit.exe'
          printf 'dummy nsis' > 'src-tauri/target/release/bundle/nsis/s2akit_0.1.0_x64-setup.exe'
          printf 'dummy msi' > 'src-tauri/target/release/bundle/msi/s2akit_0.1.0_x64_en-US.msi'
          printf 'dummy dmg' > 'src-tauri/target/release/bundle/dmg/s2akit_0.1.0_aarch64.dmg'
          printf 'dummy targz' > 'src-tauri/target/release/bundle/macos/s2akit_0.1.0_aarch64.app.tar.gz'
          printf 'dummy deb' > 'src-tauri/target/release/bundle/deb/s2akit_0.1.0_amd64.deb'
          printf 'dummy appimage' > 'src-tauri/target/release/bundle/appimage/s2akit_0.1.0_amd64.AppImage'

      # 按平台把最终安装包收敛到 dist/：只上传该目录，避免把 target/ 等中间产物带进 Artifacts
      - name: Stage artifacts (windows)
        if: ${{ !env.ACT && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = Get-Item 'src-tauri/target/release/s2akit.exe'
          $portable = "dist/s2akit_${version}_windows-x64_portable.exe"
          Copy-Item $exe.FullName $portable -Force
          Copy-Item 'src-tauri/target/release/bundle/nsis/*-setup.exe' dist/ -Force
          Copy-Item 'src-tauri/target/release/bundle/msi/*.msi' dist/ -Force
          Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Include '*.sig','*.zip' -File -ErrorAction SilentlyContinue | Copy-Item -Destination dist/ -Force
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Get-ChildItem dist/

      - name: Stage artifacts (macos)
        if: ${{ !env.ACT && matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/release/bundle/macos/*.tar.gz* dist/ || true
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Stage artifacts (linux)
        if: ${{ !env.ACT && matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/appimage/*.AppImage* dist/ || true
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/ || true
          find src-tauri/target/release/bundle -name '*.sig' -o -name '*.tar.gz*' | while read -r f; do cp "$f" dist/ || true; done
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Stage artifacts (act)
        if: ${{ env.ACT }}
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/ || true
          cp src-tauri/target/release/bundle/msi/*.msi dist/ || true
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/ || true
          cp src-tauri/target/release/bundle/macos/*.tar.gz dist/ || true
          cp src-tauri/target/release/bundle/deb/*.deb dist/ || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ || true
          cp src-tauri/target/release/s2akit.exe "dist/s2akit_0.1.0_${{ matrix.platform }}_portable.exe" || true
          ls -la dist/

      # 短期中转 Artifacts：只给 rolling-release 用，1 天过期；
      # 发布成功后由 rolling-release 主动删除，Actions 存储不累积
      - name: Upload bundles artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Preview artifacts (act)
        if: ${{ env.ACT }}
        shell: bash
        run: |
          echo "[act] ${{ matrix.platform }} staged files:"
          ls -la dist/

  rolling-release:
    needs: build
    if: ${{ !env.ACT }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 三平台产物汇总到 assets/，合并上传到同一个 ci-latest
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: assets
          merge-multiple: true

      - name: List assets
        shell: bash
        run: ls -laR assets/

      # 滚动 prerelease：每次 push 更新同一个 ci-latest，上传前清空旧资产，Release 存储不累积
      - name: Upload to rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='ci-latest'
          sha='${{ github.sha }}'
          short="${sha:0:7}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          title="s2akit CI build (v$version, $short)"
          notes="push 自动构建。
          - commit: $short
          - 分支: ${{ github.ref_name }}
          - 运行: #${{ github.run_number }}
          - 包含: windows-x64 / macos-aarch64 / linux-x64"
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo 'no assets downloaded' >&2; exit 1; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --prerelease --target "$sha" --notes "$notes" "${files[@]}"
          else
            gh release edit "$tag" --title "$title" --target "$sha" --notes "$notes"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] || continue
              gh release delete-asset "$tag" "$name" --yes
            done
            gh release upload "$tag" "${files[@]}" --clobber
          fi

      # 立刻删除本轮中转 Artifacts，不等 1 天过期，Actions 存储及时释放
      - name: Delete workflow artifacts
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].id')
          if [ -z "$ids" ]; then echo 'no workflow artifacts to delete'; exit 0; fi
          echo "$ids" | while read -r id; do
            [ -n "$id" ] || continue
            echo "deleting artifact $id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
